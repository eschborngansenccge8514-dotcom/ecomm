name = "functions-worker"
main = "src/index.ts"
compatibility_date = "2024-11-12"

[vars]
# Add non-sensitive variables here
ENVIRONMENT = "development"

# Secrets should be added via `wrangler secret put NAME` or in .dev.vars for local dev

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "ecomm-assets"

[triggers]
crons = [ "0 8 * * *", "*/10 * * * *" ]
