name: CI (Monorepo)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Turborepo to see changes

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8 # Adjust to your local pnpm version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo Build & Test
        # This only builds and tests apps that have changed
        run: pnpm dlx turbo run build test lint --filter='...[HEAD^1]'
